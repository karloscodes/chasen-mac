name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The tests of what the app knows, then the app for Apple silicon and
  # Intel, in its disk image. The snapshots are the panel in each state and
  # the icon, to see a change without a Mac.
  macos:
    name: swift test and the disk image
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: bin/build
      - name: Snapshots
        run: |
          swift build -c release --product snapshot
          "$(swift build -c release --show-bin-path)/snapshot" panels build/snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: Chasen
          path: |
            build/*.dmg
            build/snapshots/
          retention-days: 14

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [macos, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
